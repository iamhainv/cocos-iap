// Kotlin 2.2.0 matches the openiap-google 2.2.1 artifact; requires Gradle >= 7.6.3 / AGP >= 7.3.1 — Cocos 3.8.8 templates satisfy this.
buildscript {
    ext.kotlin_version = '2.2.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.cocos.iap'
    compileSdkVersion PROP_COMPILE_SDK_VERSION.toInteger()

    defaultConfig {
        minSdkVersion PROP_MIN_SDK_VERSION.toInteger()
        targetSdkPreview PROP_TARGET_SDK_VERSION
        versionCode 1
        versionName "1.0"
    }

    sourceSets.main {
        java.srcDirs "src"
        res.srcDirs 'res'
        jniLibs.srcDirs 'libs'
        manifest.srcFile "AndroidManifest.xml"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation project(':libcocos')
    // OpenIAP Google Play Billing wrapper — 2.2.1 is the vendored version.
    // Artifact coordinate confirmed against Maven Central
    // (https://central.sonatype.com/artifact/io.github.hyochan.openiap/openiap-google/2.2.1),
    // which also lists this artifact as MIT-licensed. See THIRD_PARTY_NOTICES.md.
    // To upgrade, bump the version below and re-verify the coordinate + license on Maven Central.
    implementation 'io.github.hyochan.openiap:openiap-google:2.2.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
